[package]
name = "cinnabar_core"
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
readme.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
include.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cinnabar_proc_macros = { path = "../proc_macros" }
cinnabar_save_data = { path = "../save_data" }
cinnabar_blocks = { path = "../blocks" }
cinnabar_world = { path = "../world", features = ["networking"] }
cinnabar_utils = { path = "../utils" }
cinnabar_network = { path = "../network" }
cinnabar_text = { path = "../text" }
cinnabar_redpiler = { path = "../redpiler" }
cinnabar_redstone = { path = "../redstone" }
cinnabar_schematic = { path = "../schematic" }
toml = { workspace = true }
byteorder = { workspace = true }
hematite-nbt = { workspace = true }
bitflags = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
md5 = { workspace = true }
bus = { workspace = true }
ctrlc = { workspace = true, features = ["termination"] }
tracing = { workspace = true }
rand = { workspace = true }
backtrace = { workspace = true }
rusqlite = { workspace = true, features=["bundled"] }
anyhow = { workspace = true }
toml_edit = { workspace = true }
mysql = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
reqwest = { workspace = true, features = ["json"] }
itertools = { workspace = true }
bincode = { workspace = true }
rustc-hash = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
cinnabar_world = { path = "../world", features = ["testing"] }
