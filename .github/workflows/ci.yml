name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check --all

  clippy:
    name: Clippy lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        # The repo still has pre-existing clippy warnings, so warnings do not fail the job.
        # Once clean, start failing on warnings via: -- -D warnings
        run: cargo clippy --workspace --all-features --all-targets

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run rust tests
        run: cargo test --workspace --all-features --all-targets

      - name: Run redpiler tests
        run: cargo run -p rilc test crates/redpiler/ril_tests

  packaging:
    name: Validate Docker entrypoint and Pterodactyl egg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck entrypoint
        run: shellcheck docker/entrypoint.sh

      - name: Validate Pterodactyl egg
        run: python3 pterodactyl/validate_egg.py pterodactyl/egg-cinnabar.json
